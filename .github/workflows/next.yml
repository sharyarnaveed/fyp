name: Next.js CI

on:
  push:
    branches: [ "main" ]

jobs:
  next-ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install deps
        run: npm install

      - name: Run lint
        run: npm run lint

      - name: Build project
        run: npm run build   